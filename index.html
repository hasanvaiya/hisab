<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a12">
  <title>লাইভ হিসাব খাতা - হাসান</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
</head>
<body>
  <div class="app-container" id="printable-area">
    
    <!-- TOP HEADER -->
    <header class="app-header">
      <div class="user-profile">
        <div class="avatar">
          H
          <span class="avatar-online-dot"></span>
        </div>
        <div class="user-details">
          <span class="app-title">লাইভ হিসাব খাতা</span>
          <span class="user-name">হাসান <span class="live-pulse"></span></span>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="pdf-header-btn" title="PDF রিপোর্ট">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6M12 18v-6m-3 3l3 3 3-3"/></svg>
        </button>
      </div>
    </header>

    <!-- MASTER TOTAL BALANCE CARD (All Accounts Combined) -->
    <section class="master-hero-card">
      <div class="hero-glow-orb"></div>
      <div class="hero-top-row">
        <span class="hero-label">সর্বমোট ব্যালেন্স (Total Cash)</span>
        <span class="hero-pill">🟢 LIVE SYNC</span>
      </div>
      <div class="hero-balance-row">
        <span class="hero-currency-symbol">৳</span>
        <span class="hero-balance-amount" id="balance-display">লোড হচ্ছে...</span>
        <span class="hero-currency-tag">BDT</span>
      </div>
      <div class="hero-stats-grid">
        <div class="stat-box">
          <span class="stat-title">মোট জমা</span>
          <span class="stat-value in" id="total-in-display">--</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box">
          <span class="stat-title">মোট খরচ</span>
          <span class="stat-value out" id="total-out-display">--</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box">
          <span class="stat-title">নেট ফ্লো</span>
          <span class="stat-value net" id="net-flow-display">--</span>
        </div>
      </div>
    </section>

    <!-- 3 ACCOUNTS SUMMARY CARDS (Bank, bKash, Cellfin) -->
    <section class="accounts-section">
      <div class="accounts-header">
        <span class="accounts-title">অ্যাকাউন্টভিত্তিক ব্যালেন্স</span>
      </div>
      <div class="accounts-grid">
        <!-- 1. Bank Card -->
        <div class="account-card bank-card" onclick="filterByAccount('bank')">
          <div class="acc-top">
            <div class="acc-icon bank">🏦</div>
            <span class="acc-badge bank">Bank</span>
          </div>
          <span class="acc-name">ব্যাংক</span>
          <div class="acc-balance">৳<span id="bank-balance-display">0</span></div>
        </div>

        <!-- 2. bKash Card -->
        <div class="account-card bikash-card" onclick="filterByAccount('bikash')">
          <div class="acc-top">
            <div class="acc-icon bikash">📱</div>
            <span class="acc-badge bikash">bKash</span>
          </div>
          <span class="acc-name">বিকাশ</span>
          <div class="acc-balance">৳<span id="bikash-balance-display">0</span></div>
        </div>

        <!-- 3. Cellfin Card -->
        <div class="account-card cellfin-card" onclick="filterByAccount('cellfin')">
          <div class="acc-top">
            <div class="acc-icon cellfin">⚡</div>
            <span class="acc-badge cellfin">Cellfin</span>
          </div>
          <span class="acc-name">সেলফিন</span>
          <div class="acc-balance">৳<span id="cellfin-balance-display">0</span></div>
        </div>
      </div>
    </section>

    <!-- QUICK ACTIONS -->
    <section class="quick-actions-grid">
      <div class="quick-action-item" id="btn-pdf-quick">
        <div class="quick-icon-wrapper pdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6M12 18v-6m-3 3l3 3 3-3"/></svg>
        </div>
        <span class="quick-label">PDF রিপোর্ট</span>
      </div>
      <div class="quick-action-item" id="btn-search-toggle">
        <div class="quick-icon-wrapper search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <span class="quick-label">সার্চ করুন</span>
      </div>
      <div class="quick-action-item" id="btn-count-quick">
        <div class="quick-icon-wrapper count">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        </div>
        <span class="quick-label" id="txn-count-label">-- টি হিসাব</span>
      </div>
      <a href="admin.html" class="quick-action-item">
        <div class="quick-icon-wrapper admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <span class="quick-label">অ্যাডমিন</span>
      </a>
    </section>

    <!-- TRANSACTION FEED -->
    <main class="feed-container">
      <div class="feed-header">
        <span class="feed-title">সর্বশেষ লেনদেন</span>
      </div>

      <!-- Account Filter Bar -->
      <div class="account-filter-bar">
        <button class="acc-chip active" data-account="ALL">সব অ্যাকাউন্ট</button>
        <button class="acc-chip chip-bank" data-account="bank">🏦 ব্যাংক</button>
        <button class="acc-chip chip-bikash" data-account="bikash">📱 বিকাশ</button>
        <button class="acc-chip chip-cellfin" data-account="cellfin">⚡ সেলফিন</button>
      </div>

      <!-- In / Out sub-filter -->
      <div class="sub-filter-row">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="ALL">সকল</button>
          <button class="filter-tab" data-filter="IN">জমা</button>
          <button class="filter-tab" data-filter="OUT">খরচ</button>
        </div>
      </div>

      <!-- Search Input Box -->
      <div class="search-box" id="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="আইডি, নোট বা পরিমাণ টাইপ করুন...">
      </div>

      <!-- Feed list -->
      <div class="cards-wrapper" id="cards-feed">
        <div style="text-align: center; padding: 30px; color: var(--text-dim);">লোড হচ্ছে...</div>
      </div>
    </main>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      <span>হোম</span>
    </a>
    <button class="nav-item" id="btn-pdf-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z"/><path d="M14 2v6h6M12 18v-6m-3 3l3 3 3-3"/></svg>
      <span>PDF</span>
    </button>
    <a href="admin.html" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
      <span>অ্যাডমিন</span>
    </a>
  </nav>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
